<title>우리집 캐시백</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg0:#130B36;--bg1:#23145E;--bg2:#4B2FB3;
  --glass:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  --panel:rgba(0,0,0,.28);--stroke:rgba(255,255,255,.15);--edge:rgba(0,0,0,.35);
  --text:#FFFFFF;--text-2:#D2C8FF;--muted:#9C91D8;
  --gold:#FFD23F;--gold-2:#FFA41B;--gold-edge:#C46A00;
  --cyan:#2FD3FF;--mint:#7CF7C8;--pink:#FF3D6E;--orange:#FF7A45;--red:#FF5470;
  --blue-a:#3AA8FF;--blue-b:#1E5BFF;--blue-edge:#0F2F99;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg0)}
*,*::before,*::after{box-sizing:border-box}
html,body{overscroll-behavior-y:none}
body{margin:0;min-height:100vh;color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(130% 55% at 50% -8%,var(--bg2) 0%,var(--bg1) 48%,var(--bg0) 100%) fixed,var(--bg0)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(1.2px 1.2px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 12%,#fff,transparent),radial-gradient(1.4px 1.4px at 85% 55%,#fff,transparent),radial-gradient(1px 1px at 35% 75%,#fff,transparent),radial-gradient(1px 1px at 55% 45%,#fff,transparent);background-size:340px 420px}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:10px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:1em;height:1em;fill:currentColor;display:inline-block;vertical-align:-.14em;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 130px;position:relative}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.box{background:var(--glass);border:1.5px solid var(--stroke);border-radius:20px;box-shadow:0 6px 0 var(--edge)}
.credit{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}

/* ---- lobby top ---- */
.lobby{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.lob-me{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.lob-av{position:relative;display:block}
.lvb{position:absolute;right:-7px;bottom:-7px;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:var(--cyan);color:#0B1440;border:2.5px solid var(--bg1);font-family:var(--display);font-style:normal;font-size:13px;display:grid;place-items:center}
.lob-txt b{display:block;font-family:var(--display);font-weight:400;font-size:18px;line-height:1.1}
.lob-txt small{display:block;font-size:12px;color:var(--text-2)}
.lob-xp{display:block;width:104px;height:7px;background:rgba(255,255,255,.15);border-radius:4px;margin-top:5px;overflow:hidden}
.lob-xp i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mint));border-radius:4px}
.lob-coin{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.38);border:1.5px solid var(--stroke);padding:5px 13px 5px 7px;border-radius:999px;font-family:var(--display);font-size:16px}
.lob-coin .ico{font-size:23px;color:var(--gold);filter:drop-shadow(0 0 6px rgba(255,210,63,.75))}
.mode{font-family:var(--body);font-size:11px;font-weight:700;background:rgba(255,210,63,.2);color:#FFE27A;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}

/* ---- avatar ---- */
.av{display:grid;place-items:center;border-radius:16px;position:relative;flex:none;line-height:1;box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.12)}
.av.xl{width:108px;height:108px;font-size:60px;border-radius:30px}
.av.lg{width:66px;height:66px;font-size:36px;border-radius:20px}
.av.md{width:50px;height:50px;font-size:28px;border-radius:15px}
.av.xs{width:24px;height:24px;font-size:13px;border-radius:8px;box-shadow:none}
.av.sm{width:38px;height:38px;font-size:21px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.5)}
.av .acc{position:absolute;top:-14%;right:-14%;width:46%;height:46%;background:#1B1050;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:.4em;color:var(--gold);box-shadow:0 0 8px rgba(255,210,63,.5)}
.ava-wrap{position:relative;flex:none;background:none;border:0;padding:0}
.lvtag{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);background:var(--cyan);color:#0B1440;font-family:var(--display);font-size:13px;padding:0 9px;border-radius:10px;border:2.5px solid var(--bg1);white-space:nowrap}

/* ---- hero ---- */
.hero{position:relative;padding:20px 18px 18px;border-radius:24px;background:var(--glass);border:1.5px solid var(--stroke);overflow:hidden;box-shadow:0 6px 0 var(--edge)}
.hero .glow{position:absolute;right:-50px;top:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,210,63,.42),transparent 65%);pointer-events:none}
.hero .lbl{color:var(--text-2);font-size:14px;position:relative}
.amount{position:relative;font-family:var(--display);font-size:clamp(48px,15vw,62px);line-height:1.05;margin:2px 0 12px;font-variant-numeric:tabular-nums;
  background:linear-gradient(#FFF6C8,var(--gold) 58%,var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #7A3E00)}
.amount small{font-size:.42em;margin-left:3px}
.chips{display:flex;gap:7px;flex-wrap:wrap;position:relative}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--text-2)}
.chip.fire{background:rgba(255,95,60,.22);color:#FFB19E}
.chip.fire.off{opacity:.5}
.chip.jar{color:#FFE27A;border:1px solid rgba(255,210,63,.45);background:linear-gradient(90deg,rgba(255,210,63,.12),rgba(255,210,63,.38),rgba(255,210,63,.12));background-size:200% 100%;animation:shimmer 2.2s linear infinite}
.chip.jar.pulse{animation:shimmer 2.2s linear infinite,jarPulse .5s ease-in-out 3}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes jarPulse{50%{transform:scale(1.2)}}

/* ---- goal ---- */
.goal{display:block;width:100%;margin-top:12px;padding:13px 15px;border-radius:18px;background:var(--panel);border:1.5px solid rgba(255,255,255,.06);text-align:left;cursor:pointer}
.goal .g-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goal .g-n{display:flex;align-items:center;gap:6px;font-weight:700}
.goal .g-n .ico{color:#FF6B8B}
.goal .g-p{font-family:var(--display);font-size:20px;color:var(--cyan)}
.goal .g-s{font-size:12.5px;color:var(--muted);margin-top:6px}
.goal.empty{border:1.5px dashed rgba(255,255,255,.3);text-align:center;font-family:var(--display);font-size:17px;color:var(--cyan)}
.gbar{height:14px;border-radius:9px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
.gbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--mint),var(--cyan));box-shadow:0 0 12px rgba(47,211,255,.8)}
.gbar.done i{background:linear-gradient(90deg,var(--gold),var(--gold-2));box-shadow:0 0 12px rgba(255,210,63,.8)}

/* ---- sections ---- */
.sec{font-family:var(--display);font-weight:400;font-size:21px;margin:28px 0 12px;display:flex;align-items:baseline;gap:8px}
.sec .sub{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}
.sec .cnt{font-family:var(--display);font-size:14px;color:#4A2300;background:linear-gradient(#FFE45C,#FFB21E);border-radius:999px;padding:0 10px}
.sec-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{margin:0 0 6px;color:var(--text-2);font-size:14px}
.banner{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 12px;padding:12px 14px;border:0;border-radius:18px;background:linear-gradient(95deg,var(--pink),var(--orange));color:#fff;font-weight:700;cursor:pointer;text-align:left;box-shadow:0 5px 0 #8F1238,inset 0 2px 0 rgba(255,255,255,.35)}
.banner .ico{font-size:20px}
.banner .n{font-family:var(--display);font-size:22px}
.banner .go{margin-left:auto;font-size:22px}

/* ---- quest cards ---- */
.today,.grid{display:grid;gap:12px}
.today{grid-template-columns:repeat(3,1fr)}
.grid{grid-template-columns:repeat(2,1fr)}
@media (min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
.chore{--zc:#3A8BFF;position:relative;border:0;border-radius:20px;padding:18px 8px 12px;min-height:150px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;color:#fff;
  background:var(--zc);background:linear-gradient(170deg,color-mix(in srgb,var(--zc) 62%,#fff),var(--zc) 55%,color-mix(in srgb,var(--zc) 80%,#000));
  box-shadow:0 5px 0 color-mix(in srgb,var(--zc) 55%,#000),inset 0 2px 0 rgba(255,255,255,.38);transition:transform .08s,box-shadow .08s}
.chore:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--zc) 55%,#000),inset 0 2px 0 rgba(255,255,255,.38)}
.chore .em{font-size:28px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.24);display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.chore .nm{font-family:var(--display);font-size:15.5px;line-height:1.25;word-break:keep-all;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.today .chore .nm{font-size:14.5px}
.coin{margin-top:auto;display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.3);border-radius:999px;padding:1px 10px;font-family:var(--display);font-size:15px;color:#fff}
.coin .ico{color:var(--gold)}
.coin s{opacity:.6;font-size:11px;margin-right:2px}
.chore .wn{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.85)}
.x2{position:absolute;top:-10px;right:-5px;background:linear-gradient(#FF7A45,var(--pink));color:#fff;font-family:var(--display);font-size:14px;padding:1px 9px;border-radius:9px;box-shadow:0 2px 0 #8F1238;transform:rotate(8deg);z-index:1}
.chore .done{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--mint);color:#0B3B2B;font-size:11.5px;font-weight:700;padding:1px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 0 #1C8E68;z-index:1}
.chore.did{filter:saturate(.75)}
.chore.custom{background:rgba(255,255,255,.05);border:2px dashed rgba(255,255,255,.3);box-shadow:none}
.chore.custom .em{color:var(--gold)}
.play{margin-top:16px;width:100%;border:0;border-radius:20px;padding:15px;font-family:var(--display);font-size:20px;color:#4A2300;background:linear-gradient(#FFE45C,#FFB21E);box-shadow:0 6px 0 var(--gold-edge),inset 0 2px 0 rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .08s,box-shadow .08s}
.play:active{transform:translateY(5px);box-shadow:0 1px 0 var(--gold-edge),inset 0 2px 0 rgba(255,255,255,.6)}
.more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:14px;padding:12px;border:1.5px dashed rgba(255,255,255,.3);border-radius:16px;background:rgba(255,255,255,.04);font-weight:700;cursor:pointer;color:var(--text-2)}
.zones{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;gap:8px;overflow-x:auto;padding:10px 2px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;background:rgba(19,11,54,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);scrollbar-width:none}
.zones::-webkit-scrollbar{display:none}
.zones button{flex:none;border:1.5px solid var(--stroke);background:rgba(255,255,255,.08);color:var(--text-2);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.zones button .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--zc);margin-right:6px;vertical-align:0;box-shadow:0 0 6px var(--zc)}
.zones button[aria-pressed="true"]{background:var(--zc,var(--blue-b));border-color:transparent;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.zones button[aria-pressed="true"] .dot{background:#fff}

/* ---- roles ---- */
.roles{padding:2px 14px}
.role-row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.08);padding:13px 0;text-align:left;cursor:pointer;font-weight:600;font-size:15px;color:#fff}
.role-row:last-child{border-bottom:0}
.role-row .rb{font-size:26px;color:var(--muted);display:grid}
.role-row.on .rb{color:var(--mint);filter:drop-shadow(0 0 6px rgba(124,247,200,.6))}
.role-row .rz{font-size:21px;display:grid}
.role-row .rn{flex:1}
.role-row .rs{font-family:var(--display);font-size:14px;color:#4A2300;background:linear-gradient(#FFE45C,#FFB21E);border-radius:12px;padding:3px 12px;box-shadow:0 3px 0 var(--gold-edge)}
.role-row.on .rs{background:rgba(124,247,200,.16);color:var(--mint);box-shadow:none}
.role-row.on .rn{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.role-row.pop .rb{animation:pop .45s cubic-bezier(.2,1.8,.4,1)}

/* ---- week chart ---- */
.cmp{margin:0 0 8px;font-size:14px;color:var(--text-2);font-weight:600}
.cmp b{color:var(--mint)}.cmp b.down{color:var(--muted)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;align-items:end;height:160px;padding:16px 14px 12px}
.wk .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}
.wk .v{font-family:var(--display);font-size:12px;color:var(--text-2);min-height:15px}
.wk .b{width:100%;max-width:30px;border-radius:9px 9px 4px 4px;min-height:4px;background:linear-gradient(var(--cyan),var(--blue-b));box-shadow:0 0 10px rgba(47,211,255,.45)}
.wk .b.z{background:rgba(255,255,255,.1);box-shadow:none}
.wk .col.today .b{background:linear-gradient(#FFE45C,var(--gold-2));box-shadow:0 0 12px rgba(255,210,63,.6)}
.wk .d{font-size:12px;font-weight:700;color:var(--muted)}
.wk .col.today .d{color:var(--gold)}
.wk.anim .b{animation:grow .7s cubic-bezier(.2,1.4,.4,1) both;transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}}

/* ---- logs ---- */
.list{padding:2px 14px}
.log{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);align-items:start}
.log:last-child{border-bottom:0}
.thumb{width:58px;height:58px;border-radius:14px;object-fit:cover;background:var(--panel);display:block;cursor:zoom-in;border:1.5px solid var(--stroke);padding:0;overflow:hidden}
button.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.log .who{font-weight:700}
.log .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.cm{font-size:13px;margin-top:6px;background:var(--panel);border-radius:10px;padding:6px 10px;color:var(--text-2)}
.st{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:1px 9px;border-radius:999px;font-weight:700;white-space:nowrap}
.st.pending{background:rgba(255,210,63,.18);color:#FFE27A}
.st.approved{background:rgba(124,247,200,.16);color:var(--mint)}
.st.rejected{background:rgba(255,84,112,.2);color:#FF9AAE}
.st.paid{background:rgba(255,255,255,.1);color:var(--muted)}
.empty{border:1.5px dashed rgba(255,255,255,.25);border-radius:18px;padding:22px;text-align:center;color:var(--text-2);font-weight:600;background:rgba(255,255,255,.03)}

/* ---- family ---- */
.team{padding:16px}
.team .t-h{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--text-2)}
.team .t-title{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:23px;margin:6px 0 2px}
.team .t-title .ico{color:var(--gold);filter:drop-shadow(0 0 8px rgba(255,210,63,.6))}
.team .gbar i{background:linear-gradient(90deg,var(--orange),var(--pink));box-shadow:0 0 12px rgba(255,61,110,.7)}
.team.done .gbar i{background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.team .small{margin-top:8px;font-weight:600;color:var(--text-2)}
.team .who{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.team .who span{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;background:var(--panel);border-radius:999px;padding:2px 10px 2px 3px}
.race{padding:14px 12px 4px}
.lane{display:grid;grid-template-columns:30px 1fr 62px;gap:8px;align-items:center;margin-bottom:12px}
.rank{font-size:22px;text-align:center;font-family:var(--display)}
.track{position:relative;height:50px;border-radius:14px;background:var(--panel);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 14px,transparent 14px 26px);background-size:100% 2px;background-position:center;background-repeat:no-repeat}
.track .flag{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:18px}
.runner{position:absolute;top:50%;transform:translate(calc(var(--p) * -1%),-50%);left:calc(var(--p) * 1%)}
.runner.me .av{box-shadow:0 0 0 2.5px var(--cyan),0 0 14px rgba(47,211,255,.8)}
.race.anim .runner{animation:run 1.1s cubic-bezier(.25,1,.4,1) both}
@keyframes run{from{left:0;transform:translate(0,-50%)}}
.lane .pts{font-family:var(--display);font-size:18px;text-align:right;color:var(--gold)}
.lane .pts span{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:600}
.mcard{padding:13px;display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;margin-bottom:12px}
.mcard .nm{font-weight:700}
.role{font-size:11px;font-weight:700;color:#0B1440;background:var(--cyan);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.mini{height:8px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden;margin-top:5px}
.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--cyan))}
.mcard .bal{text-align:right}
.mcard .bal b{font-family:var(--display);font-size:19px;font-weight:400;display:block;line-height:1.2;color:var(--gold)}
.seg{display:inline-flex;background:var(--panel);border:1.5px solid var(--stroke);border-radius:14px;padding:3px;margin-bottom:10px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:10px;font-size:13px;color:var(--text-2);cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:linear-gradient(var(--blue-a),var(--blue-b));color:#fff;box-shadow:0 2px 0 var(--blue-edge)}

.team .t-top{display:flex;justify-content:space-between;align-items:center;gap:8px}

const idb = (()=>{
  let p;

  const tx = (mode,fn) => open().then(db=>new Promise((res,rej)=>{ const t=db.transaction('photos',mode); const rq=fn(t.objectStore('photos')); t.oncomplete=()=>res(rq && rq.result); t.onerror=()=>rej(t.error); }));
  return { put:(k,v)=>tx('readwrite',s=>s.put(v,k)), get:k=>tx('readonly',s=>s.get(k)) };
})();
function makeLocalStore(code){
  const KEY = 'chorecash.local.' + code;
  let d = lsGet(KEY) || {config:null, members:{}, logs:{}, payouts:{}};
  const subs = new Set();
  const emit = () => subs.forEach(f=>f());
  const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){ const err=new Error('full'); err.code='full'; throw err; } emit(); };
  window.addEventListener('storage', e=>{ if(e.key===KEY){ d = lsGet(KEY) || d; emit(); } });
  const listen = (sel, cb) => { const f=()=>cb(sel()); subs.add(f); setTimeout(f,0); return ()=>subs.delete(f); };
  const arr = o => Object.entries(o).map(([id,v])=>({id,...v}));
  return {
    exists: async () => !!d.config,
    onConfig: cb => listen(()=>d.config, cb),
    onMembers: cb => listen(()=>JSON.parse(JSON.stringify(d.members)), cb),
    onFeed: cb => listen(()=>arr(d.logs).sort((a,b)=>b.createdAt-a.createdAt).slice(0,150), cb),
    onUnsettled: cb => listen(()=>arr(d.logs).filter(l=>!l.settled), cb),
    onPayouts: cb => listen(()=>arr(d.payouts).sort((a,b)=>b.at-a.at).slice(0,50), cb),
    setConfig: async c => { d.config = c; save(); },
    setMember: async (id,m) => { d.members[id] = m; save(); },
    updateMember: async (id,p) => { d.members[id] = {...d.members[id], ...p}; save(); },

    updateLog: async (id,p) => { d.logs[id] = {...d.logs[id], ...p}; save(); },

function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('script')); document.head.appendChild(s); }); }
let fbReady = null;
function firebaseReady(){
  if(fbReady) return fbReady;
  fbReady = (async()=>{
    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    await loadScript(base+'firebase-app-compat.js');
    await Promise.all([loadScript(base+'firebase-auth-compat.js'), loadScript(base+'firebase-firestore-compat.js')]);
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.firestore();

async function makeCloudStore(code){
  const db = await firebaseReady();
  const fam = db.collection('families').doc(code);
  const rows = q => q.docs.map(d=>({id:d.id, ...d.data()}));
  return {
    exists: async () => (await fam.get()).exists,
    onConfig: (cb,er) => fam.onSnapshot(s=>cb(s.exists ? (s.data().config||null) : null), er),
    onMembers: (cb,er) => fam.collection('members').onSnapshot(q=>{ const m={}; q.forEach(d=>m[d.id]=d.data()); cb(m); }, er),
    onFeed: (cb,er) => fam.collection('logs').orderBy('createdAt','desc').limit(150).onSnapshot(q=>cb(rows(q)), er),
    onUnsettled: (cb,er) => fam.collection('logs').where('settled','==',false).onSnapshot(q=>cb(rows(q)), er),
    onPayouts: (cb,er) => fam.collection('payouts').orderBy('at','desc').limit(50).onSnapshot(q=>cb(rows(q)), er),
    setConfig: c => fam.set({config:c, updatedAt:Date.now()}),
    setMember: (id,m) => fam.collection('members').doc(id).set(m),
    updateMember: (id,p) => fam.collection('members').doc(id).update(p),
    addLog: async (log, photo) => { const ref=fam.collection('logs').doc(); if(photo) await fam.collection('photos').doc(ref.id).set({data:photo}); await ref.set(log); return ref.id; },
    updateLog: (id,p) => fam.collection('logs').doc(id).update(p),
    addPayout: p => fam.collection('payouts').add(p),
    getPhoto: async id => { const s=await fam.collection('photos').doc(id).get(); return s.exists ? s.data().data : null; }
  };
}

    if(from===to || reduced()){ el.textContent=num(to); return; }
    const t0=performance.now(), dur=1000;
    const step=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=num(from+(to-from)*e); if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

function combine(a, b){
  const H=720, wa=Math.round(a.naturalWidth*H/a.naturalHeight), wb=Math.round(b.naturalWidth*H/b.naturalHeight);

  g.fillStyle='#130B36'; g.fillRect(0,0,cv.width,H); g.drawImage(a,0,0,wa,H); g.drawImage(b,wa+12,0,wb,H);

  S.busy=true;
  try{
    const base={reviewedBy:S.meId, reviewedAt:Date.now(), comment};
    await S.store.updateLog(id, ok?{...base,status:'approved',awarded:pts,awardedWon:pts*rate(),rateAt:rate()}:{...base,status:'rejected',settled:true,awarded:0});
    if(ok){
      const m=S.members[l.uid]||{}, key=l.choreId||'custom', counts={...(m.counts||{})}; counts[key]=(counts[key]||0)+1;
      const extra= l.type==='role' ? {roleTotal:(m.roleTotal||0)+1, counts} : {total:(m.total||0)+1, counts}; if(l.double) extra.doubleCount=(m.doubleCount||0)+1;
      await S.store.updateMember(l.uid, bumpPatch(m, extra));
      sfx.coin();

  }catch(e){ writeErr(e); }
  finally{ S.busy=false; }
}
async function payout(uid){
  const items=S.unsettled.filter(l=>l.uid===uid && l.status==='approved');
  const pts=items.reduce((s,l)=>s+(l.awarded||0),0); if(!pts) return;
  const w=items.reduce((s,l)=>s+logWon(l),0);
  if(!(await confirmSheet('용돈 지급 완료', `${nameOf(uid)}에게 ${won(w)} (${num(pts)}점)을 줬다고 기록할까요? 받을 용돈이 0원으로 돌아가요. 레벨과 목표 게이지는 그대로예요.`, '지급 완료')) || S.busy) return;
  S.busy=true;
  try{
    const now=Date.now();
    for(const l of items) await S.store.updateLog(l.id,{settled:true, paidAt:now});
    await S.store.addPayout({uid, points:pts, won:w, at:now, by:S.meId, count:items.length});
    const m=S.members[uid]||{};
    await S.store.updateMember(uid,{paidPoints:(m.paidPoints||0)+pts, paidWon:(m.paidWon||0)+w});
    toast(`${won(w)} 지급을 기록했어요`);
  }catch(e){ writeErr(e); }
  finally{ S.busy=false; }
}
async function saveConfig(patch){
  try{ await S.store.setConfig({...cfg(), ...patch}); return true; }catch(e){ writeErr(e); return false; }
}
const radioVal = name => { const el=document.querySelector(`input[name="${name}"]:checked`); return el?el.value:'paid'; };
async function addChore(){
  const g=k=>app.querySelector(`[data-keep="${k}"]`);
  const type=radioVal('n-type'), name=g('n-name').value.trim(), pts=parseInt(g('n-pts').value,10);
  if(!name){ toast('이름을 적어 주세요'); g('n-name').focus(); return; }
  if(!(pts>=0)){ toast('점수를 적어 주세요'); g('n-pts').focus(); return; }
  const picker=$('#add-icon-picker'), emoji=(picker && picker.dataset.val) || 'ph-sparkle';
  const chore={id:'c'+newId(), name, emoji, zone:g('n-zone').value.trim()||'기타', points:pts, type, howto:g('n-howto').value.trim(), ba:!!(app.querySelector('#n-ba')||{}).checked};
  if(await saveConfig({chores:[...chores(), chore]})){ ['n-name','n-pts','n-howto'].forEach(k=>g(k).value=''); toast('추가했어요'); }
}
async function saveChore(id){
  const type=radioVal('ec-type'), name=$('#ec-name').value.trim(), pts=parseInt($('#ec-pts').value,10);
  if(!name){ toast('이름을 적어 주세요'); return; }
  if(!(pts>=0)){ toast('점수를 적어 주세요'); return; }
  const picker=$('#edit-icon-picker'), emoji=(picker && picker.dataset.val) || 'ph-sparkle';
  const upd={name, points:pts, emoji, type, zone:$('#ec-zone').value.trim()||'기타', howto:$('#ec-howto').value.trim(), ba:$('#ec-ba').checked};
  if(await saveConfig({chores:chores().map(c=>c.id===id?{...c,...upd}:c)})){ closeModal(); toast('수정했어요'); }
}
async function moveChore(id, dir){
  const list=chores().slice(); const i=list.findIndex(c=>c.id===id), j=i+dir;
  if(i<0||j<0||j>=list.length) return;
  [list[i],list[j]]=[list[j],list[i]]; await saveConfig({chores:list});
}
async function changePin(){
  if(!(await askPin('지금 비밀번호 확인'))) return;
  sheet(`<div class="sheet-h"><h2>새 비밀번호</h2><button class="x" data-act="close" aria-label="닫기">${ic('x','b')}</button></div>
    <input id="np" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" aria-label="새 비밀번호">
    <button class="btn wide" id="np-ok" style="margin-top:12px">바꾸기</button>`, '새 비밀번호');

    if(await saveConfig({pinHash:await hashPin(S.code,v)})){ closeModal(); toast('비밀번호를 바꿨어요'); } };
}
async function setLook(patch){
  const m=me(); try{ await S.store.updateMember(S.meId,{look:{...(m.look||{}), ...patch}}); sfx.tap(); }catch(e){ writeErr(e); }
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', async e=>{
  if(e.target.closest('[data-cele]')){ fx.innerHTML=''; return; }
  if(e.target.dataset && e.target.dataset.bg){ closeModal(); return; }
  if(e.target.closest('.lb')){ modalRoot.innerHTML=''; return; }
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  switch(a){
    case 'go-start': S.phase='start'; render(); break;
    case 'go-create': S.joinEmoji=EMOJIS[0]; S.phase='create'; render(); break;
    case 'go-join': S.phase='join'; render(); break;
    case 'create': createFamily(); break;
    case 'join-code': { const v=(app.querySelector('[data-keep="j-code"]').value||'').trim().toUpperCase(); if(v.length!==6) return toast('코드 6자리를 넣어 주세요'); openFamily(v,null); break; }
    case 'join-emoji': S.joinEmoji=t.dataset.e; render(); break;
    case 'pick': if(isParent(id)){ if(!(await askPin(nameOf(id)+'(으)로 들어가기'))) return; } choose(id); break;
    case 'pick-new': S.joinEmoji=freeEmoji(); S.pickNew=true; render(); break;
    case 'pick-back': S.pickNew=false; render(); break;
    case 'new-member': newMember(); break;
    case 'switch-user': S.phase='pick'; S.pickNew=false; render(); window.scrollTo(0,0); break;
    case 'leave': if(await confirmSheet('이 기기에서 나가기','이 기기에서 가족 연결을 끊어요. 기록은 지워지지 않고, 가족 코드로 다시 들어올 수 있어요.','나가기')){ S.unsubs.forEach(f=>{try{f();}catch(x){}}); S.unsubs=[]; S.store=null; lsSet(SESS_KEY,null); S.phase='start'; render(); } break;
    case 'tab': S.tab=t.dataset.tab; if(S.tab==='do') S.animWeek=true; if(S.tab==='family') S.animRace=true; render(); window.scrollTo(0,0); break;
    case 'show-all': S.showAll=!S.showAll; sfx.tap(); render(); break;
    case 'play': { const d=doneToday(), next=daily().picks.find(c=>!d.has(c.id));
      if(next) openChore(next.id); else { S.showAll=true; render(); const z=app.querySelector('.zones'); if(z) z.scrollIntoView({behavior:reduced()?'auto':'smooth'}); } break; }
    case 'zone': S.zone=t.dataset.z; sfx.tap(); render(); break;
    case 'chore': openChore(id); break;
    case 'role': { const d=doneToday(); if(d.has(id)) { toast('오늘은 이미 인증했어요. 내일 또 해요!'); break; } openChore(id); break; }
    case 'close': closeModal(); break;
    case 'send': sendChore(); break;
    case 'zoom': zoom(id); break;
    case 'goal': openGoal(); break;
    case 'goal-save': { const name=$('#gl-name').value.trim(), w=parseInt($('#gl-won').value,10);
      if(!name) return toast('사고 싶은 것을 적어 주세요'); if(!(w>0)) return toast('금액을 적어 주세요');
      const upd={goalName:name, goalWon:w}; if(t.dataset.reset) upd.goalBase=stats(S.meId).lifeWon;
      try{ await S.store.updateMember(S.meId, upd); closeModal(); toast('목표를 정했어요! 가 보자!'); }catch(err){ writeErr(err); } break; }
    case 'goal-clear': try{ await S.store.updateMember(S.meId,{goalName:'',goalWon:0}); closeModal(); }catch(err){ writeErr(err); } break;
    case 'look-bg': setLook({bg:t.dataset.v}); break;
    case 'look-acc': setLook({acc:t.dataset.v}); break;
    case 'badge': toast(t.dataset.desc); break;
    case 'filter': S.feedFilter=t.dataset.f; render(); break;
    case 'adj': { const inp=app.querySelector(`[data-keep="pts-${id}"]`); if(inp){ inp.value=Math.max(0,(parseInt(inp.value,10)||0)+Number(t.dataset.d)); sfx.tap(); } break; }
    case 'approve': review(id,true); break;
    case 'reject': review(id,false); break;
    case 'payout': payout(id); break;
    case 'save-nick': { const v=app.querySelector('[data-keep="s-nick"]').value.trim(); if(!v) return toast('이름을 적어 주세요');
      try{ await S.store.updateMember(S.meId,{nick:v}); toast('저장했어요'); }catch(err){ writeErr(err); } break; }
    case 'set-emoji': try{ await S.store.updateMember(S.meId,{emoji:t.dataset.e}); }catch(err){ writeErr(err); } break;
    case 'pick-icon': { const p=t.closest('.emojis'); p.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false')); t.setAttribute('aria-pressed','true'); p.dataset.val=t.dataset.e; sfx.tap(); break; }
    case 'copy-code': try{ await navigator.clipboard.writeText(S.code); toast('코드를 복사했어요'); }catch(err){ toast('코드: '+S.code); } break;
    case 'save-rate': { const v=parseInt(app.querySelector('[data-keep="s-rate"]').value,10); if(!(v>=0)) return toast('숫자를 적어 주세요');
      if(await saveConfig({rate:v})) toast(`1점 = ${won(v)}으로 바꿨어요. 이미 승인된 코인은 금액 그대로예요`); break; }
    case 'team-edit': openTeam(); break;
    case 'rules': openRules(); break;
    case 'load-defaults': if(await confirmSheet('추천 목록 불러오기','지금 집안일 목록을 추천 목록(기본 역할 5개, 용돈 집안일 22개)으로 바꿀까요? 이미 올라온 기록은 그대로 남아요.','바꾸기')){ if(await saveConfig({chores:DEFAULT_CHORES})) toast('추천 목록으로 바꿨어요'); } break;
    case 'team-preset': { const sh=t.closest('.sheet'); sh.querySelectorAll('.presets button').forEach(b=>b.setAttribute('aria-pressed','false')); t.setAttribute('aria-pressed','true');
      sh.dataset.icon=t.dataset.icon; const inp=$('#tm-title'); if(inp && (!inp.value.trim() || inp.dataset.auto==='1' || TEAM_PRESETS.some(([,tt])=>tt===inp.value.trim()))){ inp.value=t.dataset.title; inp.dataset.auto='1'; } sfx.tap(); break; }
    case 'team-n': { $('#tm-target').value=t.dataset.n; sfx.tap(); break; }
    case 'team-save': saveTeam(); break;
    case 'add-chore': addChore(); break;
    case 'edit-chore': openEditChore(id); break;
    case 'save-chore': saveChore(id); break;
    case 'move-chore': moveChore(id, Number(t.dataset.dir)); break;
    case 'goto-admin': S.tab='set'; render(); { const h=document.getElementById('chore-admin'); if(h) h.scrollIntoView(); } break;
    case 'change-pin': changePin(); break;
    case 'del-chore': { const c=chores().find(x=>x.id===id); if(!c) return;
      if(await confirmSheet('집안일 삭제', `'${c.name}'을 목록에서 뺄까요? 이미 올라온 기록은 그대로 남아요.`, '삭제')){
        if(await saveConfig({chores:chores().filter(x=>x.id!==c.id)})) toast('삭제했어요'); } break; }
  }
});
document.addEventListener('change', async e=>{
  const t=e.target, a=t.dataset && t.dataset.actChange; if(!a) return;
  if(a==='sound'){ S.sound=t.checked; lsSet(SOUND_KEY, S.sound); if(S.sound) sfx.coin(); }
  if(a==='role'){ if(!(await askPin('역할 바꾸기'))){ render(); return; }
    try{ await S.store.updateMember(t.dataset.id,{role:t.value}); toast('역할을 바꿨어요'); }catch(err){ writeErr(err); } }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(fx.innerHTML) fx.innerHTML=''; else if(modalRoot.innerHTML) closeModal(); } });

/* ---------- 실시간 반영 ---------- */
function tick(){
  if(!S.store || !S.loaded || Object.values(S.loaded).some(v=>!v)) return;
  if(!S.config){ toast('가족 정보를 찾을 수 없어요'); lsSet(SESS_KEY,null); S.store=null; S.phase='start'; render(); return; }
  if(S.phase==='boot') S.phase = (S.meId && S.members[S.meId]) ? 'main' : 'pick';
  if(S.phase==='main' && !S.members[S.meId]){ S.phase='pick'; }
  if(S.phase!=='main'){ if(S.phase==='pick' && !modalRoot.innerHTML) render(); return; }
  render();
  const s=stats(S.meId), m=me(), st=streak(S.meId);
  if(st > (m.bestStreak||0) && !S.writingBest){ S.writingBest=true; S.store.updateMember(S.meId,{bestStreak:st}).catch(()=>{}).finally(()=>{ S.writingBest=false; }); }
  const B=badgeList(S.meId).filter(b=>b.got), t=team();
  const cur={bal:s.bal, lv:s.lv, goalPct:s.goal?s.goal.pct:null, goalName:s.goal?s.goal.name:null, badges:new Set(B.map(b=>b.id)), team:teamProgress(), teamKey:t.title+'|'+t.target};
  const p=S.prev;
  if(p){
    const events=[];
    if(cur.bal>p.bal){ coinBurst(); sfx.coin(); toast(`+${num(cur.bal-p.bal)}점 확정! 대기 코인이 진짜 코인이 됐어요`); }
    if(cur.lv>p.lv) events.push(()=>{ sfx.level(); celebrate(ic('star','f','color:#F2B400'),`레벨 ${cur.lv}!`,`이제 너는 "${s.title}"! 새 배경이 열렸어요.`,'최고야!'); });
    if(cur.goalPct!==null && cur.goalName===p.goalName && p.goalPct!==null && p.goalPct<100 && cur.goalPct>=100){
      S.store.updateMember(S.meId,{goalsDone:(m.goalsDone||0)+1}).catch(()=>{});
      events.push(()=>{ sfx.level(); celebrate(ic('target','f','color:var(--red)'),'목표 달성!',`${cur.goalName}을(를) 살 만큼 모았어요!`,'야호!'); });
    }
    const fresh=B.filter(b=>!p.badges.has(b.id));
    if(fresh.length) events.push(()=>{ const b=fresh[0]; sfx.level(); celebrate(`<span class="bi-big" style="--bc:${b.color}">${b.iconHTML}</span>`,'새 배지!',`${b.name}: ${b.desc}${fresh.length>1?` 외 ${fresh.length-1}개`:''}`,'멋지다!'); });
    if(t.target && p.teamKey===cur.teamKey && p.team<t.target && cur.team>=t.target) events.push(()=>{ sfx.level(); celebrate(ic(t.icon||'pizza'),'팀 목표 달성!',`${t.title}! 온 가족이 해냈어요.`,'만세!'); });
    if(events.length) setTimeout(events[0], 900);
  }
  S.prev=cur;
}

/* ---------- 시작 ---------- */
const sess=lsGet(SESS_KEY);
if(sess && sess.code) openFamily(sess.code, sess.meId);
else { S.phase='start'; render(); }
setInterval(()=>{ if(S.phase==='main' && !modalRoot.innerHTML && !fx.innerHTML) render(); }, 60000);
})();
